name: Préparer l'environnement de revue

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Installer le projet
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Vérifier les imports
        run: |
          python -c "from codamnd.version import __version__; print(__version__)"
