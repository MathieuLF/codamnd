name: Préparer l'environnement de revue

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Installer le projet
        run: |
          python scripts/setup_dev.py
      - name: Vérifier les imports
        run: |
          .venv/Scripts/python.exe -c "import tkinter; from codamnd.version import __version__; print(__version__)"
