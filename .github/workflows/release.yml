name: Préparer une mise en ligne manuelle

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag à publier, par exemple v0.1.0"
        required: true
      version:
        description: "Version sans le préfixe v, par exemple 0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: codamnd-release
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Vérifier la source de publication
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "main") {
            throw "La mise en ligne doit partir de la branche main."
          }
          git fetch origin main
          $head = (git rev-parse HEAD).Trim()
          $originMain = (git rev-parse refs/remotes/origin/main).Trim()
          if ($head -ne $originMain) {
            throw "Le commit sélectionné ne correspond pas à origin/main."
          }

      - name: Déterminer la version
        shell: pwsh
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $tag = $env:INPUT_TAG_NAME.Trim()
          $version = $env:INPUT_VERSION.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "La version doit respecter le format majeur.mineur.correctif."
          }
          if ($tag -ne "v$version") {
            throw "Le tag $tag ne correspond pas à la version $version."
          }
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Installer les dépendances de compilation
        run: |
          python -m pip install --require-hashes -r requirements-release.txt
          python -m pip install --no-deps --no-build-isolation .

      - name: Préparer les fichiers de mise en ligne
        shell: pwsh
        run: .\scripts\release.ps1 -Version $env:RELEASE_VERSION

      - name: Vérifier l'exécutable avec VirusTotal
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if (-not $env:VT_API_KEY) {
            throw "Le secret VT_API_KEY est requis pour créer une mise en ligne."
          }
          $virusTotalReport = "dist/CodaMND-v$env:RELEASE_VERSION.virustotal.md"
          python scripts/submit_virustotal.py `
            --file "dist/CodaMND/CodaMND.exe" `
            --output $virusTotalReport `
            --wait-minutes 10 `
            --require-submit `
            --fail-on-detections
          $virusTotalExitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $virusTotalReport) {
            Get-Content -LiteralPath $virusTotalReport
          }
          if ($virusTotalExitCode -ne 0) {
            exit $virusTotalExitCode
          }

      - name: Générer le manifeste de mise en ligne
        shell: pwsh
        run: |
          python scripts/generate_release_manifest.py `
            --version $env:RELEASE_VERSION `
            --require-clean-virustotal

      - name: Ajouter le score VirusTotal aux notes
        shell: pwsh
        run: |
          python scripts/append_release_verification.py `
            --version $env:RELEASE_VERSION

      - name: Créer la mise en ligne GitHub en brouillon
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG_NAME `
            --draft `
            --title "CodaMND v$env:RELEASE_VERSION" `
            --notes-file "dist/CodaMND-v$env:RELEASE_VERSION.release-notes.md" `
            "dist/CodaMND-v$env:RELEASE_VERSION-portable.zip" `
            "dist/CodaMND-v$env:RELEASE_VERSION-portable.zip.sha256" `
            "dist/CodaMND-v$env:RELEASE_VERSION-portable.exe.sha256" `
            "dist/CodaMND-v$env:RELEASE_VERSION.package.sha256" `
            "dist/CodaMND-v$env:RELEASE_VERSION.sbom.json" `
            "dist/CodaMND-v$env:RELEASE_VERSION.virustotal.md" `
            "dist/CodaMND-v$env:RELEASE_VERSION.release-manifest.json"
